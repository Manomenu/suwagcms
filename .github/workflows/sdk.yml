name: sdk

# Releases Suwagcms.Sdk to nuget.org: started by `just sdk-publish <version>`, never by a push, because a version
# there cannot be deleted. nuget.org's Trusted Publishing policy names this file, so it cannot be renamed alone (docs/release.md).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release, like 0.1.0 or 0.2.0-rc.1"
        required: true
        type: string

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  # Through the environment, never written into a script: the input is free text.
  VERSION: ${{ inputs.version }}

jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Refuse anything but master
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "::error::a release comes from master, this run is on $GITHUB_REF: merge the change, then run just sdk-publish <version> on master."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the version
        run: ./scripts/.internal/sdk-version.sh "$VERSION"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The SDK's tests need no database. The whole gate already ran on this commit in ci.yml, so a release does not repeat it.
      - name: Test the SDK
        run: dotnet test --project Suwagcms.Sdk.Tests --configuration Release --no-progress

      # The flags of scripts/.internal/sdk-publish-local.sh. The csproj holds the metadata and the snupkg.
      - name: Pack
        run: dotnet pack Suwagcms.Sdk -c Release -o nupkg -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true

      # The folder, not only the .nupkg: the push finds the .snupkg beside it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkg
          path: nupkg/
          if-no-files-found: error

  publish:
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The only job that can get a key, and it runs no code of the repository: no checkout.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nupkg
          path: nupkg

      # No global.json here: there is no checkout. The same band as global.json.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # Exchanges the job's OIDC token for a nuget.org key that lives one hour, so it comes right before the push.
      # NUGET_USER is the nuget.org profile name of the policy's owner, not the GitHub owner.
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # No --skip-duplicate: a version already there is a mistake to see, not a green run that released nothing.
      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "nupkg/Suwagcms.Sdk.$VERSION.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"
