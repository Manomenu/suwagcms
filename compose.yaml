name: suwagcms

services:
  db:
    profiles: ["db"]
    image: docker.io/library/postgres:19.0
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-suwagcms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-suwagcms}
      POSTGRES_DB: ${POSTGRES_DB:-suwagcms}
    ports:
      - "127.0.0.1:5563:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    image: suwagcms-server:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Suwagcms.Server/Dockerfile
    environment:
      ConnectionStrings__Default: ${ConnectionStrings__Default:-Host=db;Port=5432;Database=suwagcms;Username=suwagcms;Password=suwagcms}
      PAGINATION_PAGE_SIZE: ${PAGINATION_PAGE_SIZE:-}
    depends_on:
      db:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:6330/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  web:
    image: suwagcms-web:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Suwagcms.Web/Dockerfile
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://server:6330}
    ports:
      - "127.0.0.1:${WEB_PORT:-8220}:8080"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
