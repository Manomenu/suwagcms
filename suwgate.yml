profiles: [web, dotnet, database]
directories:
  web: Suwagcms.Web
steps:
  skip:
    - step: e2e
      reason: the browser tests need an empty database of their own first, which scripts/.internal/e2e.sh creates; they run there after a change a user clicks, and as their own job in CI
exceptions:
  - guard: architecture/every-project-guarded
    target: Suwagcms.Gate
    reason: the gate is the test project of the architecture guards, named without .Tests so that it reads as the gate; it has no layers of its own
  - guard: architecture/every-project-guarded
    target: Suwagcms.Cli
    reason: the CLI is flat, one folder per resource kind with no order between them, so it has no layers; its assembly is named suwagcms after the command, which the gate passes to the type guards and which this guard looks for under the project's name
  - guard: architecture/every-project-guarded
    target: Suwagcms.Sdk
    reason: the SDK is flat, one folder per part of the bot runtime and the definition format with no order between them, so it has no layers
  - guard: architecture/every-project-guarded
    target: Suwagcms.Contracts
    reason: the contracts are flat, one folder per resource kind holding only the records the API sends and receives, so they have no layers
  - guard: architecture/interfaces-have-two-implementations
    target: Suwagcms.Sdk.BotRuntime.IBotDefinitions
    reason: a public interface of the published SDK is a seam for the bots that use it; their stand-ins in tests are its other implementations, outside this repository
  - guard: comments-eslint
    target: Suwagcms.Web/src/api/openapi.d.ts
    reason: generated by openapi-typescript (just api-types), whose doc comments eslint would refuse; the api-contract step checks it equals what the server generates
  - guard: comments-sql
    target: Suwagcms.Server/Database/Migrations/up/0012_change_entry_resource.sql
    reason: a migration that already ran never changes, and grate refuses to start when a script's text changes after it ran; the comment stays with the script
  - guard: comments-sql
    target: Suwagcms.Server/Database/Migrations/up/0013_resource_body_keeps_order.sql
    reason: a migration that already ran never changes, and grate refuses to start when a script's text changes after it ran; the comment stays with the script
  - guard: comments-sql
    target: Suwagcms.Server/Database/Migrations/up/0014_drop_procedure_layout.sql
    reason: a migration that already ran never changes, and grate refuses to start when a script's text changes after it ran; the comment stays with the script
  - guard: comments-sql
    target: Suwagcms.Server/Database/Migrations/up/0015_knowledge_base_search_fields.sql
    reason: a migration that already ran never changes, and grate refuses to start when a script's text changes after it ran; the comment stays with the script
  - guard: comments-sql
    target: Suwagcms.Server/Database/Migrations/up/0016_drop_when_stalled_knowledge.sql
    reason: a migration that already ran never changes, and grate refuses to start when a script's text changes after it ran; the comment stays with the script
