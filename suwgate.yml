profiles: [web, dotnet, database]
directories:
  web: Suwagcms.Web
exceptions:
  - guard: architecture/every-project-guarded
    target: Suwagcms.Cli
    reason: the CLI is flat, one folder per resource kind with no order between them, so it has no layers
  - guard: architecture/every-project-guarded
    target: Suwagcms.Sdk
    reason: the SDK is flat, one folder per part of the bot runtime and the definition format with no order between them, so it has no layers
  - guard: architecture/every-project-guarded
    target: Suwagcms.Contracts
    reason: the contracts are flat, one folder per resource kind holding only the records the API sends and receives, so they have no layers
  - guard: architecture/interfaces-have-two-implementations
    target: Suwagcms.Sdk.BotRuntime.IBotDefinitions
    reason: a public interface of the published SDK is a seam for the bots that use it; their stand-ins in tests are its other implementations, outside this repository
  - guard: architecture/no-unused-types
    target: Suwagcms.Sdk.Format.CamelCase
    reason: its constant is used in the [GeneratedRegex] patterns of ResourceIds and SayPlaceholders; the compiler copies a const into the attribute, so the compiled code the guard reads never names the type
settings:
  docs-paths:
    ignore: [Suwagcms.Web/node_modules/, NNNN_snake_case.sql]
  hooks:
    protected: [Suwagcms.Gate/**]
    generated:
      - path: "**/openapi.d.ts"
        command: just api-types
      - path: "**/contract/openapi.json"
        command: just api-types
dev:
  name: suwagcms
  portOffset: 30
  server:
    project: Suwagcms.Server
